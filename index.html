<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>My Jobs</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px 7px;font-size:28px;font-weight:800}.tabs{display:flex;gap:7px;padding:8px 12px;overflow:auto}.tab{border:0;border-radius:18px;padding:9px 13px;background:#e5e5ea;font-weight:700;white-space:nowrap}.tab.active{background:#111;color:#fff}main{padding:8px 12px 105px}.tools,.card,.weekcard{background:#fff;border-radius:16px;margin:10px 0;padding:14px;box-shadow:0 1px 5px #0001}.card{padding:15px}.title{font-size:18px;font-weight:800}.muted{color:#666;font-size:14px;line-height:1.45;margin-top:5px}.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:10px;background:#eee;font-size:12px;font-weight:800}.money{margin-top:10px;line-height:1.55}.profit{font-size:18px;font-weight:800}.wait{margin-top:8px;font-weight:700}.summary{background:#fff;border-radius:16px;padding:14px;margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary b{font-size:20px}.row{display:flex;gap:8px}.row>*{flex:1}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:16px;background:#fff}label{font-size:13px;font-weight:700}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.small{border:0;border-radius:10px;padding:9px 11px;background:#eee;margin:4px 3px;font-weight:700}.btnrow .small{flex:1;min-width:120px}.primary{position:fixed;right:18px;bottom:20px;border:0;border-radius:28px;padding:15px 20px;background:#111;color:#fff;font-size:16px;font-weight:800;box-shadow:0 5px 20px #0003}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}.sheet{background:#f5f5f7;border-radius:22px 22px 0 0;width:100%;max-height:94vh;overflow:auto;padding:18px 16px 30px}.empty{text-align:center;color:#777;padding:45px 10px}.weekhead{width:100%;border:0;background:#fff;padding:4px 0;text-align:left;font-size:16px;font-weight:800;display:flex;justify-content:space-between}.weekbody{display:none;border-top:1px solid #eee;margin-top:10px;padding-top:10px}.weekcard.open .weekbody{display:block}.reportline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}.aiBtn{background:#111;color:#fff}.notice{font-size:12px;color:#666}.danger{font-size:12px;color:#8a3d00;background:#fff4e5;padding:9px;border-radius:10px}</style></head><body><header>My Jobs</header><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="today">Today</button><button class="tab" data-filter="open">Incomplete</button><button class="tab" data-filter="waiting">Parts Waiting</button><button class="tab" data-filter="completed">Completed</button></div><main><div class="tools"><h3>Search & Week</h3><input id="search" placeholder="Search job #, customer, address, phone, appliance, problem..."><div class="row"><div><label>Week starting</label><input id="weekStart" type="date"></div><div><label>Week ending</label><input id="weekEnd" type="date" readonly></div></div><div class="btnrow"><button class="small" id="thisWeek">This Week</button><button class="small" id="clear">Clear</button><button class="small" id="xls">⬇️ Export XLS</button><button class="small aiBtn" id="aiOpen">🤖 AI Assistant</button></div><div class="notice">Changing filters never deletes saved jobs.</div></div><div id="summary" class="summary"></div><div id="list"></div><section class="tools"><h3>Weekly Report</h3><div id="weeklyReport"></div></section></main><button class="primary" id="newJob">＋ New Job</button><div class="modal" id="modal"><div class="sheet"><h2>New / Edit Job</h2><input type="hidden" id="editId"><label>Quick Paste</label><textarea id="raw" rows="7" placeholder="Paste your normal job notes here..."></textarea><button class="small" id="parse">Parse Text</button><hr><label>Job #</label><input id="jobNo"><label>Customer</label><input id="customer"><label>Address</label><input id="address"><label>Phone</label><div class="row"><input id="phone"><input id="sc" type="number" step=".01" placeholder="Service Call $"></div><div class="row"><div><label>Appliance</label><input id="appliance"></div><div><label>Brand</label><input id="brand"></div></div><label>Model</label><input id="model"><label>Problem</label><textarea id="problem" rows="2"></textarea><label>Diagnosis / Repair</label><textarea id="diagnosis" rows="2"></textarea><label>Parts</label><textarea id="parts" rows="3"></textarea><div class="row"><div><label>Part Cost ($)</label><input id="partCost" type="number" step=".01"></div><div><label>Total Job ($)</label><input id="total" type="number" step=".01"></div></div><div class="row"><div><label>Deposit ($)</label><input id="deposit" type="number" step=".01"></div><div><label>Payment ($)</label><input id="payment" type="number" step=".01"></div></div><div class="row"><div><label>Payment Method</label><input id="paymentMethod" placeholder="Check / Cash / Card"></div><div><label>Tip ($)</label><input id="tip" type="number" step=".01"></div></div><label>Status</label><select id="status"><option>New</option><option>In Progress</option><option>Waiting Part</option><option>Follow-up</option><option>Completed</option><option>Cancelled</option></select><div class="row"><div><label>Visit Date</label><input id="visitDate" type="date"></div><div><label>Part Waiting From</label><input id="partDate" type="date"></div></div><label>Visit Time</label><input id="visitTime" placeholder="e.g. 9.05 @ 12-2 pm"><label>Notes</label><textarea id="notes" rows="2"></textarea><button class="small" id="save">Save Job</button><button class="small" id="cancel">Cancel</button></div></div><div class="modal" id="aiModal"><div class="sheet"><h2>🤖 AI Appliance Assistant</h2><label>Context</label><select id="aiScope"><option value="today">Today's jobs</option><option value="week">This week</option><option value="all">All saved jobs</option></select><textarea id="aiQuestion" rows="4" placeholder="Ask about your saved jobs or appliance diagnostics..."></textarea><label>AI Endpoint</label><input id="aiEndpoint" placeholder="https://your-worker.example.workers.dev"><label>Model</label><input id="aiModel" value="gpt-5.6-sol"><div class="danger">API key-i app-a yazma; key backend-də saxlanmalıdır.</div><button class="small aiBtn" id="askAI">Ask AI</button><button class="small" id="closeAI">Close</button><div id="aiStatus" class="notice"></div><div id="aiResult" class="card">AI answer will appear here.</div></div></div><script>
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);let jobs=[],filter="all";
try{const x=localStorage.getItem("myJobsPWA");jobs=x?JSON.parse(x):[]}catch(e){jobs=[]}
let savedAI={};try{savedAI=JSON.parse(localStorage.getItem("myJobsAI")||"{}")}catch(e){savedAI={}}
const ids=["editId","raw","jobNo","customer","address","phone","sc","appliance","brand","model","problem","diagnosis","parts","partCost","total","deposit","payment","paymentMethod","tip","visitDate","partDate","visitTime","notes"];
function saveData(){localStorage.setItem("myJobsPWA",JSON.stringify(jobs));render()}
function money(x){let m=String(x||"").match(/\$?\s*([\d]+(?:\.\d+)?)/);return m?+m[1]:0}
function fmt(s){if(!s)return"";let d=new Date(s+"T00:00:00");return isNaN(d)?s:d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function weekRange(s=today()){let d=new Date(s+"T00:00:00"),day=d.getDay(),m=new Date(d);m.setDate(d.getDate()+(day===0?-6:1-day));let e=new Date(m);e.setDate(m.getDate()+6);return[m.toISOString().slice(0,10),e.toISOString().slice(0,10)]}
function range(d,s,e){return d&&d>=s&&d<=e}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function profit(j){let t=+j.total||0,p=+j.partCost||0;return{t,p,r:Math.max(0,t-p),e:Math.max(0,t-p)*.4}}
function openForm(j){$("modal").style.display="flex";ids.forEach(id=>$(id).value="");$("status").value="New";$("visitDate").value=today();if(j){Object.keys(j).forEach(k=>$(k)&&($(k).value=j[k]??""))}}
function closeForm(){$("modal").style.display="none"}
function parseRaw(){let t=$("raw").value,ls=t.split(/\n+/).map(x=>x.trim()).filter(Boolean),all=t.replace(/\r/g," ");if(ls[0])$("jobNo").value=(ls[0].match(/^\d+/)||[""])[0];let tm=ls.find(x=>/^\d{1,2}[.\/-]\d{1,2}\s*@/i.test(x));if(tm){$("visitTime").value=tm;let d=tm.match(/^(\d{1,2})[.\/-](\d{1,2})/);if(d)$("visitDate").value=`${new Date().getFullYear()}-${String(+d[1]).padStart(2,"0")}-${String(+d[2]).padStart(2,"0")}`};let a=ls.find(x=>/\b(MA|Massachusetts)\b/i.test(x)&&/\d{5}/.test(x));if(a)$("address").value=a;let ph=ls.find(x=>/\d{3}[\s().-]*\d{3}[\s.-]*\d{4}/.test(x));if(ph)$("phone").value=(ph.match(/\+?1?[\s().-]*\d{3}[\s().-]*\d{3}[\s.-]*\d{4}/)||[""])[0];let ai=a?ls.indexOf(a):-1;if(ai>=0&&ls[ai+1])$("customer").value=ls[ai+1].replace(/^Name:\s*/i,"");let nm=ls.find(x=>/^Name:/i.test(x));if(nm)$("customer").value=nm.replace(/^Name:\s*/i,"");let sc=ls.find(x=>/\bsc\s*\$?\s*\d/i.test(x));if(sc)$("sc").value=money(sc);let ap=ls.find(x=>/(washer|wm|dryer|dishwasher|dw|oven|stove|range|refrigerator|fridge|rf)/i.test(x));if(ap){let low=ap.toLowerCase();$("appliance").value=/dishwasher|\bdw\b/.test(low)?"Dishwasher":/washer|\bwm\b/.test(low)?"Washer":/dryer/.test(low)?"Dryer":/oven/.test(low)?"Oven":/stove|range/.test(low)?"Stove":/refrigerator|fridge|\brf\b/.test(low)?"Refrigerator":"";let b=ap.match(/samsung|lg|ge|whirlpool|maytag|bosch|electrolux|frigidaire|kenmore/i);if(b)$("brand").value=b[0]};let pc=all.match(/(?:part|parts)\s*cost\s*[:=]?\s*\$?\s*([\d]+(?:\.\d+)?)/i);if(pc)$("partCost").value=pc[1];let tot=ls.find(x=>/^total(?:\s+job)?\b/i.test(x)&&/\d/.test(x));if(tot)$("total").value=money(tot);let dep=ls.find(x=>/deposit/i.test(x)&&/\d/.test(x));if(dep)$("deposit").value=money(dep);let tip=ls.find(x=>/\btip\b/i.test(x)&&/\d/.test(x));if(tip)$("tip").value=money(tip);let pay=ls.find(x=>/(paid|payment received|job finish|job finished)/i.test(x)&&/\d/.test(x));if(pay)$("payment").value=money(pay);let meth=all.match(/\b(check|cash|credit\s*card|card|venmo|zelle)\b/i);if(meth)$("paymentMethod").value=meth[1];if(/waiting\s*(for)?\s*part/i.test(all)){$("status").value="Waiting Part";$("partDate").value=$("visitDate").value||today()}else if(/job\s*finish|completed|complete/i.test(all))$("status").value="Completed";else if(/deposit/i.test(all))$("status").value="In Progress"}
function render(){let q=$("search").value.trim().toLowerCase(),s=$("weekStart").value,e=$("weekEnd").value;let a=jobs.filter(j=>{let ok=filter==="all"||(filter==="today"&&j.visitDate===today())||(filter==="open"&&!["Completed","Cancelled"].includes(j.status))||(filter==="waiting"&&j.status==="Waiting Part")||(filter==="completed"&&j.status==="Completed");return ok&&(!q||Object.values(j).join(" ").toLowerCase().includes(q))&&(!s||range(j.visitDate,s,e))});let earn=a.reduce((n,j)=>n+profit(j).e,0);$("summary").innerHTML=`<div>Jobs<br><b>${a.length}</b></div><div>Completed<br><b>${a.filter(j=>j.status==="Completed").length}</b></div><div>Parts Waiting<br><b>${a.filter(j=>j.status==="Waiting Part").length}</b></div><div>My Earnings<br><b>$${earn.toFixed(2)}</b></div>`;a.sort((x,y)=>String(y.visitDate||y.updated).localeCompare(String(x.visitDate||x.updated)));$("list").innerHTML=a.length?a.map(j=>{let p=profit(j);return`<div class="card"><div class="title">${esc(j.jobNo?'#'+j.jobNo+' — ':'')}${esc(j.customer)||'No customer'} ${j.appliance?'— '+esc(j.appliance):''}</div><div class="muted">${esc(fmt(j.visitDate))} ${j.visitTime?'• '+esc(j.visitTime):''}<br>${esc(j.address)}<br>${esc(j.brand)} ${esc(j.model)} ${j.problem?'• '+esc(j.problem):''}</div><span class="badge">${esc(j.status)}</span>${j.status==="Waiting Part"?`<div class="wait">📦 Waiting ${Math.max(0,Math.floor((Date.now()-new Date((j.partDate||j.visitDate||today())+"T00:00:00"))/86400000))} days</div>`:""}<div class="money">Total: <b>$${p.t.toFixed(2)}</b> • Part: <b>$${p.p.toFixed(2)}</b><br>After Part: <b>$${p.r.toFixed(2)}</b> • <span class="profit">My 40%: $${p.e.toFixed(2)}</span></div><button class="small edit">Edit</button>${j.status!=="Completed"?`<button class="small complete">Complete</button>`:""}<button class="small delete">Delete</button></div>`}).join(""):"<div class='empty'>No jobs here yet.</div>";document.querySelectorAll(".edit").forEach((b,i)=>b.onclick=()=>openForm(a[i]));document.querySelectorAll(".complete").forEach((b,i)=>b.onclick=()=>{let j=a[i];j.status="Completed";j.updated=new Date().toISOString();saveData()});document.querySelectorAll(".delete").forEach((b,i)=>b.onclick=()=>{if(confirm("Delete this job?")){jobs=jobs.filter(x=>x.id!==a[i].id);saveData()}});renderWeekly()}
function renderWeekly(){let m={};jobs.forEach(j=>{if(!j.visitDate)return;let[s,e]=weekRange(j.visitDate);m[s]??={s,e,jobs:[]};m[s].jobs.push(j)});let w=Object.values(m).sort((a,b)=>b.s.localeCompare(a.s));$("weeklyReport").innerHTML=w.length?w.map(x=>{let t=x.jobs.reduce((n,j)=>n+profit(j).t,0),p=x.jobs.reduce((n,j)=>n+profit(j).p,0),e=x.jobs.reduce((n,j)=>n+profit(j).e,0);return`<div class="weekcard"><button class="weekhead" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'"><span>${fmt(x.s)} — ${fmt(x.e)}</span><span>›</span></button><div class="weekbody"><div class="reportline"><span>Jobs</span><b>${x.jobs.length}</b></div><div class="reportline"><span>Total Job</span><b>$${t.toFixed(2)}</b></div><div class="reportline"><span>Part Cost</span><b>$${p.toFixed(2)}</b></div><div class="reportline"><span>My Earnings</span><b>$${e.toFixed(2)}</b></div></div></div>`}).join(""):"<div class='empty'>No weekly data yet.</div>"}
function makeXLS(list,title){let h='<table border="1"><tr><th>Job #</th><th>Visit Date</th><th>Customer</th><th>Address</th><th>Phone</th><th>Brand</th><th>Appliance</th><th>Problem</th><th>Diagnosis</th><th>Parts</th><th>Part Cost</th><th>Total</th><th>Deposit</th><th>Payment</th><th>Payment Method</th><th>Tip</th><th>Status</th><th>My Earnings</th></tr>'+list.map(j=>{let p=profit(j);return`<tr><td>${esc(j.jobNo)}</td><td>${esc(fmt(j.visitDate))}</td><td>${esc(j.customer)}</td><td>${esc(j.address)}</td><td>${esc(j.phone)}</td><td>${esc(j.brand)}</td><td>${esc(j.appliance)}</td><td>${esc(j.problem)}</td><td>${esc(j.diagnosis)}</td><td>${esc(j.parts)}</td><td>${p.p.toFixed(2)}</td><td>${p.t.toFixed(2)}</td><td>${+j.deposit||0}</td><td>${+j.payment||0}</td><td>${esc(j.paymentMethod)}</td><td>${+j.tip||0}</td><td>${esc(j.status)}</td><td>${p.e.toFixed(2)}</td></tr>`}).join("")+"</table>";let u=URL.createObjectURL(new Blob([`<html><meta charset="UTF-8"><body><h2>${esc(title)}</h2>${h}</body></html>`],{type:"application/vnd.ms-excel"})),a=document.createElement("a");a.href=u;a.download=title.replace(/[^a-z0-9]+/gi,"_")+".xls";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function aiContext(){let l=jobs,s=$("aiScope").value;if(s==="today")l=jobs.filter(j=>j.visitDate===today());if(s==="week"){let[a,b]=weekRange();l=jobs.filter(j=>range(j.visitDate,a,b))}return l}
$("newJob").onclick=()=>openForm();$("cancel").onclick=closeForm;$("save").onclick=()=>{let id=$("editId").value||Date.now().toString(),j={id};ids.slice(1).forEach(k=>j[k]=$(k).value);j.status=$("status").value;j.updated=new Date().toISOString();let i=jobs.findIndex(x=>x.id===id);i>=0?jobs[i]=j:jobs.unshift(j);saveData();closeForm()};$("parse").onclick=parseRaw;$("search").oninput=render;$("weekStart").onchange=()=>{let s=$("weekStart").value;if(s){let[,e]=weekRange(s);$("weekEnd").value=e}render()};$("thisWeek").onclick=()=>{let[a,b]=weekRange();$("weekStart").value=a;$("weekEnd").value=b;render()};$("clear").onclick=()=>{$("search").value="";$("weekStart").value="";$("weekEnd").value="";filter="all";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.filter==="all"));render()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});$("xls").onclick=()=>{let q=$("search").value.trim().toLowerCase(),s=$("weekStart").value,e=$("weekEnd").value;makeXLS(jobs.filter(j=>(!q||Object.values(j).join(" ").toLowerCase().includes(q))&&(!s||range(j.visitDate,s,e))),s?"My Jobs "+fmt(s)+" - "+fmt(e):"My Jobs Report")};$("aiOpen").onclick=()=>{$("aiModal").style.display="flex";$("aiEndpoint").value=localStorage.getItem("myJobsAIEndpoint")||savedAI.endpoint||"";$("aiModel").value=localStorage.getItem("myJobsAIModel")||savedAI.model||"gpt-5.6-sol"};$("closeAI").onclick=()=>$("aiModal").style.display="none";$("askAI").onclick=async()=>{let ep=$("aiEndpoint").value.trim(),q=$("aiQuestion").value.trim();if(!ep||!q){$("aiStatus").textContent="Add endpoint and question first.";return}localStorage.setItem("myJobsAIEndpoint",ep);localStorage.setItem("myJobsAIModel",$("aiModel").value.trim()||"gpt-5.6-sol");$("aiStatus").textContent="Thinking...";try{let r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,model:$("aiModel").value.trim()||"gpt-5.6-sol",jobs:aiContext(),today:today()})}),d=await r.json();if(!r.ok)throw Error(d.error||("HTTP "+r.status));$("aiResult").textContent=d.answer||d.output_text||"No answer returned.";$("aiStatus").textContent="Done."}catch(e){$("aiStatus").textContent=e.message}};render();
</script></body></html>
